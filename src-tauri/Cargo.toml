[package]
name = "pocketboot"
version = "0.1.0"
description = "Boots a battery-less RadioMaster Pocket over USB"
edition = "2021"
default-run = "pocketboot"
publish = false

[lib]
name = "pocketboot_lib"
crate-type = ["rlib"]

[[bin]]
name = "pocketboot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-notification = "2.7"
tauri-plugin-dialog = "2"
nusb = "0.2.8"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
proptest = "1.12"
tempfile = "3"
