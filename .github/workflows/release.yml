name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version, for example 0.1.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pocketboot-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Enter a stable version such as 0.1.1, without a leading v."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release tag v$RELEASE_VERSION already exists. Choose a new version."
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Update app version files
        run: node scripts/set-version.mjs "$RELEASE_VERSION"

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          CERTIFICATE_PATH="$RUNNER_TEMP/pocketboot-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pocketboot-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Check Apple signing and notarization secrets
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_IDENTITY APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Build pinned universal dfu-util
        run: scripts/build-dfu-util.sh

      - name: Sign dfu-util sidecars
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          for binary in src-tauri/binaries/dfu-util-*-apple-darwin; do
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          done

      - name: Build, sign, and notarize app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Prepare release assets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG_SOURCE="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$DMG_SOURCE" ]]; then
            echo "Tauri did not produce a DMG."
            exit 1
          fi
          xcrun notarytool submit "$DMG_SOURCE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_SOURCE"
          xcrun stapler validate "$DMG_SOURCE"
          DMG_PATH="$RUNNER_TEMP/PocketBoot-v$RELEASE_VERSION-macOS-universal.dmg"
          CHECKSUM_PATH="$RUNNER_TEMP/PocketBoot-v$RELEASE_VERSION-SHA256SUMS.txt"
          cp "$DMG_SOURCE" "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "$CHECKSUM_PATH"
          echo "RELEASE_DMG=$DMG_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUMS=$CHECKSUM_PATH" >> "$GITHUB_ENV"

      - name: Commit version and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git tag -a "$RELEASE_TAG" -m "PocketBoot $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## PocketBoot $RELEASE_VERSION

          Download the universal macOS disk image below and follow the install
          and setup instructions in the repository README.
          EOF
          gh release create "$RELEASE_TAG" "$RELEASE_DMG" "$RELEASE_CHECKSUMS" \
            --verify-tag \
            --title "PocketBoot $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
